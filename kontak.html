<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Kontak - VALIER</title>
  <link rel="stylesheet" href="kontak.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
</head>
<body class="dark-mode">

  <!-- Header -->
  <header class="header">
    <div class="container">
      <img src="gambar/logonew.jpg" alt="VALIER Logo" class="logo">
      <nav>
        <ul>
          <li><a href="index.html">Beranda</a></li>
          <li><a href="#">Produk</a></li>
          <li><a href="tentang.html">Tentang</a></li>
          <li><a href="kontak.html">Kontak</a></li>
        </ul>
      </nav>
      <button class="mode-toggle" id="toggleMode">🌙</button>
    </div>
  </header>

  <!-- Kontak Section -->
  <section class="contact-info">
    <div class="container">
      <h2>Hubungi & Ikuti Kami</h2>
      <div class="contact-grid">
        <a href="https://wa.me/6283879763945" target="_blank" class="contact-box">
          <span>📱</span>
          <p>WhatsApp<br><strong>0838-7976-3945</strong></p>
        </a>
        <a href="https://instagram.com/valier_official" target="_blank" class="contact-box">
          <span>📷</span>
          <p>Instagram<br><strong>@valier_official</strong></p>
        </a>
        <a href="https://tiktok.com/@arkputra07" target="_blank" class="contact-box">
          <span>🎵</span>
          <p>TikTok<br><strong>@arkputra07</strong></p>
        </a>
        <a href="mailto:valierofficialbrand@gmail.com" class="contact-box">
          <span>✉️</span>
          <p>Email<br><strong>valierofficialbrand@gmail.com</strong></p>
        </a>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <p>&copy; 2025 VALIER. All rights reserved.</p>
      <div class="socials">
        <a href="#">Instagram</a>
        <a href="#">Facebook</a>
        <a href="#">Email</a>
      </div>
    </div>
  </footer>

  <!-- Script Dark Mode -->
  <script>
    const toggleBtn = document.getElementById("toggleMode");
    const body = document.body;

    function setMode() {
      if (body.classList.contains("dark-mode")) {
        toggleBtn.textContent = "🌙";
        localStorage.setItem("mode", "dark");
      } else {
        toggleBtn.textContent = "☀️";
        localStorage.setItem("mode", "light");
      }
    }

    toggleBtn.addEventListener("click", () => {
      body.classList.toggle("dark-mode");
      body.classList.toggle("light-mode");
      setMode();
    });

    window.addEventListener("DOMContentLoaded", () => {
      const saved = localStorage.getItem("mode");
      if (saved === "light") {
        body.classList.remove("dark-mode");
        body.classList.add("light-mode");
      }
      setMode();
    });
  </script>
</body>
</html>
